  
name: Build Mini Kasir

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install C++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build Program
        run: g++ -std=c++17 main.cpp -o mini-kasir

      - name: Run Program
        run: echo "Build Mini Kasir Berhasil!"
